<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>GAMERS 관리자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <!-- 관리자 사이트 진입 HTML (vite.admin.config.ts). 사용자 사이트는 index.html -->
    <meta name="color-scheme" content="dark" />
    <style>
      /*
       * 모듈 JS·CSS 를 불러오기 전 첫 화면 배경. 모듈 사이 이동은 전체 페이지 이동이라
       * 이 값이 없으면 새 페이지가 그려지기 전 잠깐 흰 화면이 보인다. (canvas 토큰 #010102)
       */
      html,
      body {
        margin: 0;
        background-color: #010102;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin-main.tsx"></script>
  </body>
</html>
