<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap"

    />

    <script>
      // board 테마 (기본 dark). 다른 모듈은 main.tsx 에서 항상 dark 적용.
      try { if ((localStorage.getItem('theme') ?? 'dark') === 'dark') document.documentElement.classList.add('dark'); } catch (e) { document.documentElement.classList.add('dark'); }
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
